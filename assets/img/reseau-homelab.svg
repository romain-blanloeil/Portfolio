<svg viewBox="0 0 1350 780" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Space Grotesk', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; fill: #2B2B2E; }
      .tag { font-family: 'IBM Plex Mono', monospace; fill: #1F6F6B; }
      .label { font-family: 'Space Grotesk', sans-serif; font-weight: 600; fill: #2B2B2E; }
      .mono { font-family: 'IBM Plex Mono', monospace; fill: #55565A; }
      .mono-small { font-family: 'IBM Plex Mono', monospace; fill: #6B6B6E; }
      .line { stroke: #1F6F6B; stroke-width: 2; fill: none; }
      .box { fill: #FFFFFF; stroke: #1F6F6B; stroke-width: 1.6; }
      .chip { fill: #DCEEEB; stroke: #1F6F6B; stroke-width: 1.4; }
    </style>
  </defs>

  <!-- fond -->
  <rect x="0" y="0" width="1350" height="780" fill="#F6F2E9" />

  <!-- titre -->
  <text x="70" y="52" class="tag" font-size="15">## architecture</text>
  <text x="70" y="86" class="title" font-size="30">Réseau personnel — Homelab</text>

  <!-- Internet -->
  <g transform="translate(560,20)">
    <path d="M20,55 a20,20 0 0,1 0,-40 a25,25 0 0,1 48,-8 a22,22 0 0,1 32,20 a18,18 0 0,1 -4,28 z"
          fill="#FFFFFF" stroke="#1F6F6B" stroke-width="1.6" />
    <text x="48" y="34" text-anchor="middle" class="label" font-size="13">Internet</text>
  </g>

  <line x1="600" y1="95" x2="600" y2="120" class="line" />

  <!-- Box FAI -->
  <rect x="480" y="120" width="240" height="52" rx="10" class="box" />
  <text x="600" y="142" text-anchor="middle" class="label" font-size="14">Box FAI</text>
  <text x="600" y="160" text-anchor="middle" class="mono-small" font-size="11">192.168.0.1 · bridge / DMZ</text>

  <line x1="600" y1="172" x2="600" y2="196" class="line" />

  <!-- Proxmox / Firewall -->
  <rect x="400" y="196" width="400" height="92" rx="10" class="box" />
  <text x="420" y="220" class="label" font-size="14">Proxmox — Hyperviseur</text>
  <rect x="420" y="230" width="175" height="40" rx="8" class="chip" />
  <text x="507" y="247" text-anchor="middle" class="mono-small" font-size="10.5">OPNsense</text>
  <text x="507" y="261" text-anchor="middle" class="mono-small" font-size="10.5">firewall · routage</text>
  <rect x="605" y="230" width="175" height="40" rx="8" class="chip" />
  <text x="692" y="247" text-anchor="middle" class="mono-small" font-size="10.5">VM services</text>
  <text x="692" y="261" text-anchor="middle" class="mono-small" font-size="10.5">réseau (DNS/GLPI…)</text>

  <line x1="600" y1="288" x2="600" y2="312" class="line" />

  <!-- Switch -->
  <rect x="440" y="312" width="320" height="50" rx="10" class="box" />
  <text x="600" y="333" text-anchor="middle" class="label" font-size="14">Switch managé PoE</text>
  <text x="600" y="350" text-anchor="middle" class="mono-small" font-size="10.5">TP-Link SG2210P/MP</text>

  <!-- bus horizontal vers les VLANs -->
  <line x1="600" y1="362" x2="600" y2="392" class="line" />
  <line x1="135" y1="392" x2="1065" y2="392" class="line" />

  <!-- VLAN chips -->
  <!-- positions x: 70,225,380,535,690,845,1000 ; centre = x+65 -->

  <!-- Perso -->
  <line x1="135" y1="392" x2="135" y2="430" class="line" />
  <rect x="70" y="430" width="130" height="100" rx="10" class="box" />
  <text x="135" y="452" text-anchor="middle" class="label" font-size="13">Perso</text>
  <text x="135" y="470" text-anchor="middle" class="tag" font-size="10.5">VLAN 10</text>
  <text x="135" y="488" text-anchor="middle" class="mono-small" font-size="10">10.10.0.0/24</text>

  <!-- Enfant -->
  <line x1="290" y1="392" x2="290" y2="430" class="line" />
  <rect x="225" y="430" width="130" height="100" rx="10" class="box" />
  <text x="290" y="452" text-anchor="middle" class="label" font-size="13">Enfant</text>
  <text x="290" y="470" text-anchor="middle" class="tag" font-size="10.5">VLAN 20</text>
  <text x="290" y="488" text-anchor="middle" class="mono-small" font-size="10">10.20.0.0/24</text>

  <!-- IoT -->
  <line x1="445" y1="392" x2="445" y2="430" class="line" />
  <rect x="380" y="430" width="130" height="100" rx="10" class="box" />
  <text x="445" y="452" text-anchor="middle" class="label" font-size="13">IoT</text>
  <text x="445" y="470" text-anchor="middle" class="tag" font-size="10.5">VLAN 30</text>
  <text x="445" y="488" text-anchor="middle" class="mono-small" font-size="10">10.30.0.0/24</text>

  <!-- Homelab / Lab TSSR -->
  <line x1="600" y1="392" x2="600" y2="430" class="line" />
  <rect x="535" y="430" width="130" height="100" rx="10" class="chip" />
  <text x="600" y="452" text-anchor="middle" class="label" font-size="13">Homelab</text>
  <text x="600" y="470" text-anchor="middle" class="tag" font-size="10.5">VLAN 42</text>
  <text x="600" y="488" text-anchor="middle" class="mono-small" font-size="10">10.42.0.0/24</text>
  <text x="600" y="504" text-anchor="middle" class="mono-small" font-size="9.5">LAB_TSSR</text>

  <!-- Invités -->
  <line x1="755" y1="392" x2="755" y2="430" class="line" />
  <rect x="690" y="430" width="130" height="100" rx="10" class="box" />
  <text x="755" y="452" text-anchor="middle" class="label" font-size="13">Invités</text>
  <text x="755" y="470" text-anchor="middle" class="tag" font-size="10.5">VLAN 66</text>
  <text x="755" y="488" text-anchor="middle" class="mono-small" font-size="10">10.66.0.0/24</text>

  <!-- Storage -->
  <line x1="910" y1="392" x2="910" y2="430" class="line" />
  <rect x="845" y="430" width="130" height="100" rx="10" class="box" />
  <text x="910" y="452" text-anchor="middle" class="label" font-size="13">Storage</text>
  <text x="910" y="470" text-anchor="middle" class="tag" font-size="10.5">VLAN 88</text>
  <text x="910" y="488" text-anchor="middle" class="mono-small" font-size="10">10.88.0.0/24</text>

  <!-- Management -->
  <line x1="1065" y1="392" x2="1065" y2="430" class="line" />
  <rect x="1000" y="430" width="130" height="100" rx="10" class="box" />
  <text x="1065" y="452" text-anchor="middle" class="label" font-size="13">Management</text>
  <text x="1065" y="470" text-anchor="middle" class="tag" font-size="10.5">VLAN 99</text>
  <text x="1065" y="488" text-anchor="middle" class="mono-small" font-size="10">10.99.0.0/24</text>
  <text x="1065" y="504" text-anchor="middle" class="mono-small" font-size="9.5">AP / Switch</text>

  <!-- NAS relié au Storage -->
  <line x1="910" y1="530" x2="910" y2="565" class="line" />
  <rect x="795" y="565" width="230" height="100" rx="10" class="box" />
  <text x="910" y="588" text-anchor="middle" class="label" font-size="13">NAS (VM Proxmox)</text>
  <text x="910" y="606" text-anchor="middle" class="mono-small" font-size="10">TrueNAS Scale / Debian · Samba+NFS</text>
  <text x="910" y="622" text-anchor="middle" class="mono-small" font-size="10">ZFS mirror — 2 disques</text>
  <text x="910" y="642" text-anchor="middle" class="tag" font-size="10">accès: HOME + ADMIN/LAB_TSSR</text>

  <!-- Serveur AD/GLPI relié au Homelab (zone de test) -->
  <line x1="600" y1="530" x2="600" y2="565" class="line" />
  <rect x="490" y="565" width="220" height="100" rx="10" class="chip" />
  <text x="600" y="588" text-anchor="middle" class="label" font-size="13">Serveur AD / GLPI</text>
  <text x="600" y="606" text-anchor="middle" class="mono-small" font-size="10">PC SFF/Tiny · 6c+ 16Go+ 500Go+</text>
  <text x="600" y="622" text-anchor="middle" class="mono-small" font-size="10">blanloeil.home + zone test</text>
  <text x="600" y="642" text-anchor="middle" class="tag" font-size="10">Active Directory · GLPI</text>

  <!-- Borne WiFi : câble physique vers le switch, port trunk (plusieurs VLANs taggés) -->
  <path d="M 760,337 H 1245 V 430" class="line" />
  <text x="1002" y="330" text-anchor="middle" class="tag" font-size="10">port trunk</text>
  <rect x="1160" y="430" width="150" height="130" rx="10" class="box" />
  <text x="1235" y="452" text-anchor="middle" class="label" font-size="13">Borne WiFi PoE</text>
  <text x="1235" y="470" text-anchor="middle" class="mono-small" font-size="10">mgmt: VLAN 99</text>
  <text x="1235" y="484" text-anchor="middle" class="mono-small" font-size="10">(trunk)</text>
  <text x="1235" y="504" text-anchor="middle" class="mono-small" font-size="10">SSID → Perso / IoT</text>
  <text x="1235" y="518" text-anchor="middle" class="mono-small" font-size="10">/ Invités</text>
  <text x="1235" y="540" text-anchor="middle" class="tag" font-size="9.5">réseau à part</text>

  <!-- footer -->
  <text x="70" y="740" class="mono-small" font-size="11">blanloeil.home</text>
</svg>
